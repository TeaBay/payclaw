[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "payclaw"
version = "0.1.1"
description = "Drop-in x402 payment middleware for MCP servers — charge AI agents per tool call with USDC"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
fastapi = ["fastapi>=0.100"]
flask = ["flask>=2.3"]

[project.urls]
Homepage = "https://github.com/TeaBay/payclaw"

[tool.setuptools.packages.find]
where = ["."]
include = ["payclaw*"]
